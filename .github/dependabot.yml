version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-patch-days: 7
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    # Newer Recharts 3.6 releases change tooltip/legend types used by four
    # chart surfaces; keep the exact reviewed line until that migration lands.
    ignore:
      - dependency-name: recharts
        versions: ['>=3.6.1 <4']
      # npm alias supplied by @wagmi/connectors, not a registry name.
      - dependency-name: cbw-sdk
    groups:
      npm-routine:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      actions-routine:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories:
      - /
      - /backend
      - /backend/src/db
    schedule:
      interval: weekly
      day: wednesday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      docker-routine:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      docker-security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: build
