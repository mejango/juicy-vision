version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-patch-days: 7
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    # Recharts 3.10 changes tooltip/legend types used by four chart surfaces;
    # keep it on the reviewed line until that UI migration is covered.
    ignore:
      - dependency-name: recharts
        versions: ['>=3.10.0 <4']
    groups:
      npm-routine:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      actions-routine:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories:
      - /
      - /backend
      - /backend/src/db
    schedule:
      interval: weekly
      day: wednesday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      docker-routine:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      docker-security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: build
