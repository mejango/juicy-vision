services:
  db:
    build:
      context: ./backend/src/db
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: juicyvision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3004:3004"
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const r=await fetch('http://127.0.0.1:3004/livez');if(!r.ok)Deno.exit(1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      PORT: 3004
      DENO_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/juicyvision
      JWT_SECRET: dev-secret
      CRON_SECRET: dev-cron-secret
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
